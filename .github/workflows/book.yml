name: book
on:
  schedule:
    # UTC. GitHub retarde parfois les schedules de plusieurs heures: 2 déclenchements en avance
    # (≥2h avant 7h Paris été/hiver); main.py attend 7h00:00 Europe/Paris.
    - cron: "17 2 * * 1-5"
    - cron: "47 3 * * 1-5"
  workflow_dispatch:
concurrency: book  # un seul run à la fois (le suivant attend)
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: echo "$USERS_JSON" > users.json
        env: {USERS_JSON: "${{ secrets.USERS_JSON }}"}
      - run: python main.py
