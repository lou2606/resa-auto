name: book
on:
  schedule:
    # UTC. Démarre ~1h avant 7h Paris (été et hiver); main.py attend 7h00:00 Europe/Paris.
    - cron: "45 4 * * 1-5"
  workflow_dispatch:
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: echo "$USERS_JSON" > users.json
        env: {USERS_JSON: "${{ secrets.USERS_JSON }}"}
      - run: python main.py
